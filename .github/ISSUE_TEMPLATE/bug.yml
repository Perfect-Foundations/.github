name: Bug report
description: Report behavior that violates a documented contract.
title: "[Bug] "
labels: []
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What documented behavior did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic reproduction, including inputs and feature flags.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / revision
      description: Crate version, commit SHA, or release.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Rust version, target, operating system, architecture, and relevant features.
  - type: textarea
    id: notes
    attributes:
      label: Additional evidence
      description: Reference values, traces, logs, or comparisons.
